services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.5
    container_name: keycloak_demo
    ports:
      - "9090:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: password
    volumes:
      - keycloak_data:/opt/keycloak/data
    command: ["start-dev"]

  club-service:
    build:
      context: .
      dockerfile: club-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/scouting_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/users
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/users/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_started

  player-service:
    build:
      context: .
      dockerfile: player-service/Dockerfile
    environment:
      PLAYER_DB_URL: jdbc:mysql://mysql:3306/scouting_db
      PLAYER_DB_USERNAME: root
      PLAYER_DB_PASSWORD: root

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile

volumes:
  mysql_data:
  keycloak_data:
